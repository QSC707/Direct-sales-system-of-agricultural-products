    <style>
        .photo-upload-card {
            position: relative;
            width: 100%;
            height: 200px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }
        
        .photo-upload-card:hover {
            border-color: #007bff;
        }
        
        .photo-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
        }
        
        .farm-photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .photo-delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 10;
            border-radius: 4px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(220, 53, 69, 0.9);
            border: none;
            color: white;
            font-size: 12px;
            font-weight: 500;

        .photo-delete-btn:hover {
            background-color: #dc3545;
            transform: scale(1.05);

        .photo-replace-btn {
            position: absolute;
            top: 40px;
            right: 8px;
            z-index: 10;
            border-radius: 4px;
            padding: 4px 8px;
            display: flex;
            align-items: center;

            color: white;

        .photo-upload-card.has-image {
            border-style: solid;
            border-color: #28a745;

        .photo-upload-card.uploading {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0,123,255,0.3);
        }
        
        .photo-upload-card.error {

        .upload-progress {

        .progress {

            margin-bottom: 5px;
        }
        
        .progress-text {
            font-size: 12px;

    <script>
        // 全局变量 - 简化版本
        let farmPhotos = []; // 存储当前农场照片数组
        let currentUploadIndex = -1; // 当前上传的照片索引
        let isUploading = false; // 上传状态标记
        let networkStatus = navigator.onLine; // 网络状态
        let retryQueue = []; // 重试队列
        
        /**
         * 页面加载完成后执行
         */
        document.addEventListener('DOMContentLoaded', function() {
            // 使用initDependencies确保jQuery加载

        /**

            // 监听网络状态变化
            window.addEventListener('online', function() {
                networkStatus = true;
                console.log('网络已连接');
                hideNetworkWarning();
                
                // 处理重试队列
                processRetryQueue();
            });
            
            window.addEventListener('offline', function() {
                networkStatus = false;
                console.log('网络已断开');
                showNetworkWarning();
            });
            
            // 初始检查网络状态
            if (!navigator.onLine) {
                networkStatus = false;
                showNetworkWarning();
            }
        }
        
        /**

                        <i class="fa fa-wifi"></i> 网络连接断开，上传功能暂时不可用
                    </div>
                `;
                $('.card-header').after(warningHtml);
            }

        /**

            $('.network-warning').remove();
        }
        
        /**
         * 处理重试队列
         */
        function processRetryQueue() {
            if (retryQueue.length > 0 && networkStatus) {
                const retryItem = retryQueue.shift();
                if (retryItem.type === 'upload') {
                    uploadPhoto(retryItem.file, retryItem.index);
                } else if (retryItem.type === 'delete') {
                    deletePhoto(retryItem.index);
                }
            }
        }

        /**
         * 绑定卡片事件 - 统一事件绑定函数
         */
        function bindCardEvents(card, index) {
            // 绑定卡片点击事件
            card.off('click').on('click', function(e) {
                if ($(e.target).closest('.photo-delete-btn').length > 0) {
                    return;
                }
                
                if (isUploading) {
                    showToast('正在上传中，请稍候...', 'warning');
                    return;
                }
                
                if (!networkStatus) {
                    showToast('网络连接断开，请检查网络后重试', 'error');
                    return;
                }
                
                currentUploadIndex = index;
                $('#farmPhotoInput').click();
            });
            
            // 绑定删除按钮事件
            card.find('.photo-delete-btn').off('click').on('click', function(e) {
                e.stopPropagation();
                
                if (isUploading) {
                    showToast('正在上传中，请稍候...', 'warning');
                    return;
                }
                
                if (!networkStatus) {
                    showToast('网络连接断开，请检查网络后重试', 'error');
                    return;
                }
                
                const deleteIndex = parseInt($(this).data('index'));
                deletePhoto(deleteIndex);
            });
            
            // 绑定替换按钮事件
            card.find('.photo-replace-btn').off('click').on('click', function(e) {
                e.stopPropagation();
                
                if (isUploading) {
                    showToast('正在上传中，请稍候...', 'warning');
                    return;
                }
                
                if (!networkStatus) {
                    showToast('网络连接断开，请检查网络后重试', 'error');
                    return;
                }
                
                const replaceIndex = parseInt($(this).data('index'));
                replacePhoto(replaceIndex);
            });
        }
        
        /**
         * 上传照片 - 修复版本，确保正确处理API响应
         */
        async function uploadPhoto(file, index) {
            if (isUploading) {
                showToast('正在上传中，请稍候...', 'warning');
                return;
            }
            
            try {
                // 文件验证
                const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
                if (!allowedTypes.includes(file.type)) {
                    throw new Error('不支持的文件格式，请选择JPG、PNG、GIF或WebP格式');
                }
                
                if (file.size > 5 * 1024 * 1024) {
                    throw new Error('文件大小超过5MB，请选择较小的图片');
                }
                
                // 检查网络连接
                if (!navigator.onLine) {
                    throw new Error('网络连接断开，请检查网络后重试');
                }
                
                isUploading = true;
                const card = $(`.photo-upload-card[data-index="${index}"]`);
                const statusDiv = card.find('.upload-status');
                
                // 显示上传状态
                card.addClass('uploading');
                statusDiv.text('正在上传...').removeClass('success error').show();
                
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const farmerId = user.userId;
                
                if (!farmerId) {
                    throw new Error('未找到用户ID，请重新登录');
                }
                
                // 创建FormData
                const formData = new FormData();
                formData.append('photo', file);
                
                // 添加超时控制
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30秒超时
                
                try {
                    // 发送上传请求
                    const response = await fetch(`/api/upload/farm-photo/${farmerId}/${index + 1}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: formData,
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        if (response.status === 401) {
                            throw new Error('登录已过期，请重新登录');
                        } else if (response.status === 403) {
                            throw new Error('权限不足，无法上传照片');
                        } else if (response.status === 413) {
                            throw new Error('文件过大，服务器拒绝接收');
                        } else if (response.status >= 500) {
                            throw new Error('服务器错误，请稍后重试');
                        } else {
                            throw new Error(`上传失败 (HTTP ${response.status})`);
                        }
                    }
                    
                    const result = await response.json();
                    console.log('上传API响应:', result);
                    
                    if (result.code === 200) {
                        // 修复：正确处理API响应中的图片URL
                        let photoUrl = null;
                        
                        // 尝试多种可能的字段名，包括API实际返回的photoPath
                        if (result.data) {
                            photoUrl = result.data.photoPath ||  // API实际返回的字段
                                      result.data.photoUrl || 
                                      result.data.filePath || 
                                      result.data.url || 
                                      result.data.path ||
                                      result.data.imageUrl;
                        }
                        
                        // 如果还是没有找到URL，尝试从result直接获取
                        if (!photoUrl) {
                            photoUrl = result.photoPath ||  // API实际返回的字段
                                      result.photoUrl || 
                                      result.filePath || 
                                      result.url || 
                                      result.path ||
                                      result.imageUrl;
                        }
                        
                        console.log('解析出的图片URL:', photoUrl);
                        
                        if (!photoUrl) {
                            throw new Error('服务器返回的图片URL为空');
                        }
                        
                        // 确保URL是完整的
                        if (photoUrl.startsWith('/')) {
                            // 相对路径，添加域名
                            photoUrl = window.location.origin + photoUrl;
                        }
                        
                        // 上传成功，立即更新本地数据
                        farmPhotos[index] = photoUrl;
                        
                        // 显示成功状态
                        statusDiv.text('上传成功').addClass('success').show();
                        
                        // 立即更新界面显示，不需要重新加载整个资料
                        updatePhotoCard(index, photoUrl);
                        
                        // 显示成功提示
                        showToast(`照片${index + 1}上传成功`, 'success');
                        
                        // 2秒后隐藏状态提示
                setTimeout(() => {
                            statusDiv.hide();
                        }, 2000);
                        
                        console.log(`照片${index + 1}上传成功:`, photoUrl);
                        
            } else {
                        throw new Error(result.message || '上传失败');
                    }
                    
                } catch (fetchError) {
                    clearTimeout(timeoutId);
                    
                    if (fetchError.name === 'AbortError') {
                        throw new Error('上传超时，请检查网络连接后重试');
                    } else {
                        throw fetchError;
                    }
                }
                
            } catch (error) {
                console.error('上传照片失败:', error);
                
                const card = $(`.photo-upload-card[data-index="${index}"]`);
                const statusDiv = card.find('.upload-status');
            
            // 显示错误信息
                let errorMessage = error.message;
                if (errorMessage.includes('NetworkError') || errorMessage.includes('Failed to fetch')) {
                    errorMessage = '网络错误，请检查网络连接后重试';
                }
                
                statusDiv.text('上传失败: ' + errorMessage).addClass('error').show();
                card.removeClass('uploading');
                
                // 显示错误提示
                showToast(`照片${index + 1}上传失败: ${errorMessage}`, 'error');
                
                // 5秒后隐藏错误信息
                setTimeout(() => {
                    statusDiv.hide();
                    card.removeClass('uploading');
                }, 5000);
                
                // 如果是网络错误，添加到重试队列
                if (errorMessage.includes('网络') || errorMessage.includes('超时')) {
                    retryQueue.push({
                        type: 'upload',
                        file: file,
                        index: index
                    });
                    
                    showToast('已添加到重试队列，网络恢复后将自动重试', 'info');
                }
                
            } finally {
                isUploading = false;
            }
        }
        
        /**
         * 立即更新单个照片卡片显示 - 性能优化版本
         */
        function updatePhotoCard(index, photoUrl) {

                    </button>

        /**

            $('.toast-message').remove();
            
            const toastClass = {
                'success': 'alert-success',
                'error': 'alert-danger',

        /**
         * 防抖函数 - 防止频繁操作
         */
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        /**
         * 初始化照片上传功能 - 添加防抖机制
         */
        function initPhotoUpload() {
            // 绑定文件选择事件，添加防抖
            const debouncedUpload = debounce(function(file, index) {
                if (file && index >= 0 && !isUploading) {
                    uploadPhoto(file, index);
                }
            }, 300);
            
            $('#farmPhotoInput').on('change', function() {
                const file = this.files[0];
                if (file && currentUploadIndex >= 0) {
                    debouncedUpload(file, currentUploadIndex);
                }
                // 清空文件输入框
                this.value = '';
            });
        }
        
        /**
         * 删除照片 - 优化版本，确保删除后立即更新显示
         */
        async function deletePhoto(index) {
            if (!farmPhotos[index]) {

                }
                
            // 使用优雅的确认对话框
            if (!await showConfirm('确定要删除这张照片吗？')) {

            // 检查网络连接
            if (!navigator.onLine) {

                return;
            }
            
            const card = $(`.photo-upload-card[data-index="${index}"]`);
            const statusDiv = card.find('.upload-status');
            
            try {
                // 显示删除状态
                statusDiv.text('正在删除...').removeClass('success error').show();
                
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const farmerId = user.userId;
                
                if (!farmerId) {
                    throw new Error('未找到用户ID');
                }
                
                // 添加超时控制
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000); // 15秒超时
                
                try {
                    // 发送删除请求
                    const response = await fetch(`/api/upload/farm-photos/${farmerId}/${index + 1}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`,
                            'Content-Type': 'application/json'
                        },
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        if (response.status === 401) {
                            throw new Error('登录已过期，请重新登录');
                        } else if (response.status === 403) {
                            throw new Error('权限不足，无法删除照片');
                        } else if (response.status === 404) {
                            // 照片不存在，直接更新本地状态
                            console.log('照片不存在于服务器，直接更新本地状态');
                        } else if (response.status >= 500) {
                            throw new Error('服务器错误，请稍后重试');
                        } else {
                            throw new Error(`删除失败 (HTTP ${response.status})`);
                        }
                    }
                    
                    const result = await response.json();
                    
                    if (result.code === 200 || response.status === 404) {
                        // 删除成功，立即更新本地数据和界面
                        farmPhotos[index] = null;
                        
                        // 显示成功状态
                        statusDiv.text('删除成功').addClass('success').show();
                        
                        // 立即更新界面显示
                        updatePhotoCardToEmpty(index);
                        
                        // 显示成功提示
                        showToast(`照片${index + 1}删除成功`, 'success');
                        
                        // 2秒后隐藏状态提示
                        setTimeout(() => {
                            statusDiv.hide();
                        }, 2000);
                        
                        console.log(`照片${index + 1}删除成功`);
                        
                } else {
                        throw new Error(result.message || '删除失败');
                    }
                    
                } catch (fetchError) {
                    clearTimeout(timeoutId);
                    
                    if (fetchError.name === 'AbortError') {
                        throw new Error('删除超时，请检查网络连接后重试');
                    } else {
                        throw fetchError;
                    }
                }
                
            } catch (error) {

                // 显示错误信息
                let errorMessage = error.message;
                if (errorMessage.includes('NetworkError') || errorMessage.includes('Failed to fetch')) {
                    errorMessage = '网络错误，请检查网络连接后重试';
                }
                
                statusDiv.text('删除失败: ' + errorMessage).addClass('error').show();
                
                // 显示错误提示
                showToast(`照片${index + 1}删除失败: ${errorMessage}`, 'error');
                
                // 5秒后隐藏错误信息
                    setTimeout(() => {
                    statusDiv.hide();
                }, 5000);
                
                // 如果是网络错误，添加到重试队列
                if (errorMessage.includes('网络') || errorMessage.includes('超时')) {
                    retryQueue.push({
                        type: 'delete',
                        index: index
                    });
                    
                    showToast('已添加到重试队列，网络恢复后将自动重试', 'info');
                }
            }
        }
        
        /**
         * 显示确认对话框 - 修复aria-hidden警告
         */
        function showConfirm(message) {
            return new Promise((resolve) => {
                // 移除现有的确认框
                $('.confirm-dialog').remove();
                
                const confirmHtml = `
                    <div class="modal fade confirm-dialog" tabindex="-1" style="z-index: 10000;">
                        <div class="modal-dialog modal-sm">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h6 class="modal-title">确认操作</h6>
                                </div>
                                <div class="modal-body">
                                    <p>${message}</p>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary btn-sm" data-action="cancel">取消</button>
                                    <button type="button" class="btn btn-danger btn-sm" data-action="confirm">确定</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                $('body').append(confirmHtml);
                
                const modal = $('.confirm-dialog');
                let isResolved = false;
                
                // 绑定按钮事件
                modal.find('[data-action="confirm"]').on('click', function() {
                    if (!isResolved) {
                        isResolved = true;
                        // 先移除焦点，再隐藏模态框
                        $(this).blur();
                        if(modal[0].bootstrap) modal[0].bootstrap.hide();
                        setTimeout(() => resolve(true), 100);
                    }
                });
                
                modal.find('[data-action="cancel"]').on('click', function() {
                    if (!isResolved) {
                        isResolved = true;
                        // 先移除焦点，再隐藏模态框
                        $(this).blur();
                        if(modal[0].bootstrap) modal[0].bootstrap.hide();
                        setTimeout(() => resolve(false), 100);
                    }
                });
                
                // 模态框关闭时清理
                modal.on('hidden.bs.modal', function() {
                    if (!isResolved) {
                        isResolved = true;
                        resolve(false);
                    }
                    // 延迟移除DOM元素，避免焦点问题
                    setTimeout(() => {
                        $(this).remove();
                    }, 100);
                });
                
                // 显示模态框
                modal[0].bootstrap = modal[0].bootstrap || new bootstrap.Modal(modal[0]); modal[0].bootstrap.show();
                
                // 模态框显示后设置焦点到取消按钮（更安全的选择）
                modal.on('shown.bs.modal', function() {
                    modal.find('[data-action="cancel"]').focus();
                });
            });
        }
        
        /**
         * 保存农户资料
         */
        async function saveFarmerProfile() {
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const userId = user.userId;
                
                if (!userId) {
                    throw new Error('未找到用户ID');
                }
                
                // 收集表单数据
                const farmData = {
                    farmName: $('#farmName').val(),
                    location: $('#location').val(),
                    description: $('#description').val(),
                    productCategory: $('#productCategory').val(),
                    licenseNumber: $('#licenseNumber').val(),
                    establishedDate: $('#establishedDate').val()
                };
                
                // 保存农场资料
                await saveProfileData(userId, farmData);
            } catch (error) {
                console.error('保存过程中出错:', error);
                alert('保存过程中出错: ' + error.message);
            }
        }
        
        /**
         * 保存农场资料数据
         */
        async function saveProfileData(userId, farmData) {
            try {
                console.log('保存农场资料:', farmData);
                
                // 格式化日期
                const formattedData = {
                    userId: userId,
                    farmName: farmData.farmName,
                    location: farmData.location,
                    description: farmData.description || '',
                    productCategory: farmData.productCategory || '',
                    licenseNumber: farmData.licenseNumber || '',
                    establishedDate: farmData.establishedDate ? new Date(farmData.establishedDate).toISOString() : null
                };
                
                // 使用Axios发送请求
                const response = await http.post('/api/farmerprofile', formattedData);
                
                if (response && response.code === 200) {
                    console.log('农场资料保存成功');
                    alert('农场资料保存成功');
                    
                    // 重新加载农场资料
                    await loadFarmProfile();
                } else {
                    throw new Error('保存失败: ' + (response.message || '未知错误'));
                }
            } catch (error) {
                console.error('保存农场资料失败', error);
                alert('保存农场资料失败: ' + error.message);
            }
        }
        
        /**
         * 替换照片
         * @param {number} index - 照片索引
         */
        async function replacePhoto(index) {
            if (isUploading) {
                showToast('正在上传中，请稍候...', 'warning');
                return;
            }
            
            if (!networkStatus) {
                showToast('网络连接断开，请检查网络后重试', 'error');
                            return;
                        }
                        
            // 创建文件选择器
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/jpeg,image/jpg,image/png,image/gif,image/webp';
            fileInput.style.display = 'none';
            
            fileInput.onchange = async function(e) {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    
                    // 显示确认对话框
                    const confirmed = await showConfirm(`确定要替换照片${index + 1}吗？`);
                    if (confirmed) {
                        uploadPhoto(file, index);
                    }
                }
                
                // 清理文件输入元素
                document.body.removeChild(fileInput);
            };
            
            // 添加到页面并触发点击
            document.body.appendChild(fileInput);
            fileInput.click();
        }
    </script>
