    <script>
        /**
         * 退出登录函数
         */
        function handleLogout() {
            // 获取当前角色，在跳转前保存
            const userStr = localStorage.getItem('user');
            let role = 'farmer'; // 默认为农户角色
            
            try {
                if (userStr) {
                    const userData = JSON.parse(userStr);
                    role = userData.role || 'farmer';
                }
            } catch (e) {
                console.error('解析用户数据失败:', e);
            }
            
            // 清除本地存储的认证信息
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            localStorage.removeItem('username');
            localStorage.removeItem('role');
            localStorage.removeItem('user');
            
            // 记住上次的角色，便于用户再次登录时直接选择相同角色
            sessionStorage.setItem('last_role', role);
            
            // 显示退出提示
            alert('您已成功退出登录');
            
            // 重定向到登录页面，并传递提示参数和之前的角色
            window.location.href = '/pages/login.html?reason=logout&last_role=' + role;
        }

        /**
         * 初始化农户首页
         */
        function initFarmerDashboard() {
            console.log('农户中心首页初始化');
                
                // 检查用户是否登录，并且是农户角色
                checkLogin(function(user) {
                    if (user && user.role === 'farmer') {
                        // 显示农户信息
                    if (typeof $ !== 'undefined') {
                        $('#farmerName').text(user.username);
                        
                        // 确保用户下拉菜单可见
                        $('#userDropdown').show();
                        $('#currentUsername').text(user.username);
                        
                        // 隐藏登录注册按钮
                        $('#loginItem, #registerItem').hide();
                    } else {
                        // 使用原生JavaScript
                        const farmerNameEl = document.getElementById('farmerName');
                        if (farmerNameEl) farmerNameEl.textContent = user.username;
                        
                        const userDropdownEl = document.getElementById('userDropdown');
                        if (userDropdownEl) userDropdownEl.style.display = 'block';
                        
                        const currentUsernameEl = document.getElementById('currentUsername');
                        if (currentUsernameEl) currentUsernameEl.textContent = user.username;
                        
                        const loginItemEl = document.getElementById('loginItem');
                        const registerItemEl = document.getElementById('registerItem');
                        if (loginItemEl) loginItemEl.style.display = 'none';
                        if (registerItemEl) registerItemEl.style.display = 'none';
                    }
                    } else {
                        // 如果不是农户，跳转到登录页面并显示提示
                        alert('您需要以农户身份登录才能访问此页面');
                        window.location.href = '../login.html?role=farmer&redirect=' + encodeURIComponent(window.location.href);
                    }
                });

            // 绑定退出登录按钮事件
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('退出登录按钮被点击');
                    handleLogout();
                });
            }
        }

        /**
         * 页面加载完成后执行
         */
        function initPage() {
            // 检查jQuery是否已加载
            if (typeof $ === 'undefined') {
                console.log('jQuery未加载，等待依赖加载完成...');
                // 使用依赖管理系统等待jQuery加载
                if (typeof window.initDependencies === 'function') {
                    window.initDependencies(function() {
                        console.log('依赖加载完成，开始初始化农户首页');
                        initFarmerDashboard();
                    });
                } else {
                    // 如果依赖管理系统未加载，延迟重试
                    setTimeout(initPage, 100);
                }
                return;
            }
            
            // jQuery已加载，直接初始化
            initFarmerDashboard();
        }
        
        // 等待页面DOM加载完成
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
