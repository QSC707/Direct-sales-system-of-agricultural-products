    <style>
        .main-container {
            padding: 20px;
            min-height: calc(100vh - 160px);
        }
        
        .welcome-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .stats-cards {
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid #f0f0f0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }
        
        .stat-card-primary::before {
            background: linear-gradient(135deg, #007bff, #0056b3);
        }
        
        .stat-card-success::before {
            background: linear-gradient(135deg, #28a745, #1e7e34);
        }
        
        .stat-card-info::before {
            background: linear-gradient(135deg, #17a2b8, #117a8b);
        }
        
        .stat-content {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .stat-info h3 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            color: #2c3e50;
        }
        
        .stat-info p {
            font-size: 1.1rem;
            margin: 5px 0 0 0;
            color: #6c757d;
            font-weight: 500;
        }
        
        .welcome-text {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .welcome-left h4 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }
        
        .welcome-left p {
            margin: 0;
            opacity: 0.9;
        }
        
        .welcome-right {
            text-align: right;
        }
        
        .welcome-badge {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            margin-top: 10px;
            display: inline-block;
        }
        
        /* 导航栏样式统一 */
        .navbar-nav .nav-link {
            padding: 8px 12px;
            font-size: 13px;
        }
        
        @media (max-width: 768px) {
            .welcome-text {
                flex-direction: column;
                text-align: center;
            }
            
            .welcome-right {
                text-align: center;
                margin-top: 15px;
            }
            
            .stat-content {
                flex-direction: column;
                text-align: center;
            }
        }
        
        .stat-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
        
        .stat-footer a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #6c757d;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .stat-footer a:hover {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="users.html">

                        </a>

                    <li class="nav-item">

    <!-- 主内容 -->
    <div class="container-fluid main-container">
        <!-- 欢迎栏 -->
        <div class="welcome-bar">
            <div class="welcome-text">
                <div class="welcome-left">
                    <h4>
                        管理控制台
                    </h4>
                    <p>
                        欢迎，<span id="adminName" class="fw-bold">管理员</span> |

                </div>
                <div class="welcome-right">

                </div>

        </div>

        <!-- 统计卡片 -->
        <div class="stats-cards">
            <div class="row">
                <!-- 用户总数 -->

                    <div class="stat-card stat-card-primary">
                        <div class="stat-content">
                            <div class="stat-info">
                                <h3 id="totalUsers">--</h3>
                                <p>用户总数</p>
                            </div>
                        </div>
                        <div class="stat-footer">
                            <a href="users.html">

                            </a>
                        </div>

                </div>
                
                <!-- 农户数量 -->

    <!-- 页脚 -->

        </div>

    <!-- 移除重复的Bootstrap JavaScript引用，由依赖管理系统统一处理 -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script> -->

    <script>
        /**
         * 页面加载完成后执行
         */
        function initDashboard() {
            // 检查jQuery是否已加载
            if (typeof $ === 'undefined') {
                console.log('jQuery未加载，等待依赖加载完成...');
                // 使用依赖管理系统等待jQuery加载
                if (typeof window.initDependencies === 'function') {
                    window.initDependencies(function() {
                        console.log('依赖加载完成，开始初始化页面');
                        initDashboardContent();
                    });
                } else {
                    // 如果依赖管理系统未加载，延迟重试
                    setTimeout(initDashboard, 100);
                }
                return;
            }
            
            // jQuery已加载，直接初始化
            initDashboardContent();
        }
        
        /**
         * 初始化页面内容
         */
        function initDashboardContent() {
            console.log('开始初始化管理首页内容');
            
            // 确保Bootstrap已加载
            if (typeof bootstrap === 'undefined') {
                console.log('Bootstrap未加载，等待Bootstrap加载完成...');
                setTimeout(initDashboardContent, 100);
                return;
            }
            
            console.log('Bootstrap已加载，版本检查...');
            
            // 检查Bootstrap Dropdown是否可用
            if (typeof bootstrap.Dropdown !== 'function') {
                console.error('Bootstrap Dropdown组件不可用');
                setTimeout(initDashboardContent, 100);
                return;
            }
            
            console.log('Bootstrap Dropdown组件可用，开始初始化下拉菜单');
            
            try {
                // 手动初始化Bootstrap下拉菜单
                const dropdownElementList = [].slice.call(document.querySelectorAll('.dropdown-toggle'));
                console.log('找到下拉框元素数量:', dropdownElementList.length);
                
                const dropdownList = dropdownElementList.map(function (dropdownToggleEl, index) {
                    console.log(`初始化下拉框 ${index + 1}:`, dropdownToggleEl.id || '无ID');
                    
                    // 检查元素是否已经初始化过
                    const existingDropdown = bootstrap.Dropdown.getInstance(dropdownToggleEl);
                    if (existingDropdown) {
                        console.log(`下拉框 ${index + 1} 已经初始化过，跳过`);
                        return existingDropdown;
                    }
                    
                    return new bootstrap.Dropdown(dropdownToggleEl);
                });
                
                console.log('下拉菜单初始化完成，数量:', dropdownList.length);
                
                // 添加事件监听器来调试下拉框行为
                dropdownElementList.forEach((element, index) => {
                    element.addEventListener('show.bs.dropdown', function() {
                        console.log(`下拉框 ${index + 1} 正在显示`);
                    });
                    
                    element.addEventListener('shown.bs.dropdown', function() {
                        console.log(`下拉框 ${index + 1} 已显示`);
                    });
                    
                    element.addEventListener('hide.bs.dropdown', function() {
                        console.log(`下拉框 ${index + 1} 正在隐藏`);
                    });
                    
                    element.addEventListener('hidden.bs.dropdown', function() {
                        console.log(`下拉框 ${index + 1} 已隐藏`);
                    });
                });
                
            } catch (error) {
                console.error('下拉菜单初始化失败:', error);
            }
            
            // 获取并显示当前日期
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const formattedDate = now.toLocaleDateString('zh-CN', options);
            document.getElementById('currentDate').textContent = formattedDate;
            
            // 检查用户是否登录，并且是管理员角色
            checkLogin(function(user) {
                if (user && user.role === 'admin') {
                    // 显示管理员信息
                    document.getElementById('adminName').textContent = user.username;
                    document.getElementById('currentUsername').textContent = user.username;
                    
                    // 显示上次登录时间（模拟数据）
                    const lastLogin = new Date();
                    lastLogin.setHours(lastLogin.getHours() - Math.floor(Math.random() * 24));
                    document.getElementById('lastLoginTime').textContent = lastLogin.toLocaleString('zh-CN');
                    
                    // 加载统计数据
                    loadStatistics();
                } else {
                    // 如果不是管理员，跳转到登录页面并显示提示
                    alert('您需要以管理员身份登录才能访问此页面');
                    window.location.href = '../login.html?role=admin&redirect=' + encodeURIComponent(window.location.href);
                }
            });
            
            // 绑定退出登录按钮点击事件
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('退出登录按钮被点击');
                    logout();
                });
            } else {
                console.warn('未找到退出登录按钮');
            }
            
            console.log('管理首页初始化完成');
        }
        
        // 等待页面DOM加载完成
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initDashboard);
        } else {
            initDashboard();
        }
        
        /**
         * 加载统计数据
         */
        async function loadStatistics() {
            try {
                // 调用管理员统计API
                const result = await http.get('/api/admin/statistics');
                const data = result.data;
                
                // 更新统计卡片
                document.getElementById('totalUsers').textContent = data.totalUsers || 0;
                document.getElementById('totalFarmers').textContent = data.totalFarmers || 0;
                document.getElementById('totalProducts').textContent = data.totalProducts || 0;
                
                console.log('统计数据加载成功', data);
                
            } catch (error) {
                console.error('加载统计数据失败', error);
                
                // 显示错误提示但不影响页面正常显示
                document.getElementById('totalUsers').textContent = '--';
                document.getElementById('totalFarmers').textContent = '--';
                document.getElementById('totalProducts').textContent = '--';
                
                // 显示错误信息
                console.error('统计数据加载失败:', error.response?.data?.message || error.message);
            }
        }
    </script>
    <script src="/pages/update-navbar.js"></script>
</body>
